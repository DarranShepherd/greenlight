name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install site dependencies
        working-directory: site
        run: npm install

      - name: Build Tailwind CSS
        working-directory: site
        run: npm run build

      - name: Download latest firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p site/firmware

          latest_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          if [ -z "${latest_tag}" ]; then
            echo "No releases found yet — site will deploy without firmware binaries."
            exit 0
          fi

          echo "Fetching firmware from release ${latest_tag}"
          gh release download "${latest_tag}" \
            --pattern "firmware-*-merged.bin" \
            --pattern "metadata.json" \
            --dir site/firmware \
            --clobber

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
