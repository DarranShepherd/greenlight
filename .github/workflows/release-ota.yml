name: OTA Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build And Publish OTA Artifacts
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install asset generation dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install --yes nodejs npm python3-cairosvg python3-pil
          npm install --global lv_font_conv

      - name: Build firmware from tag
        shell: bash
        run: |
          set -eu
          . /opt/esp/idf/export.sh
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          build_board() {
            board="$1"
            PROJECT_VER="${VERSION}" sh tools/validate.sh firmware "${board}"
            cp "build-${board}/greenlight.bin" "dist/firmware-${board}.bin"
            # Merged image for first-time browser flashing via ESP Web Tools.
            idf.py -B "build-${board}" merge-bin -o "dist/firmware-${board}-merged.bin" --format raw
          }

          build_board esp32_2432s028_ili9341
          build_board esp32_2432s028_st7789
          build_board esp32_32e_st7789

      - name: Generate OTA metadata
        shell: bash
        run: |
          set -eu
          . /opt/esp/idf/export.sh
          VERSION="${GITHUB_REF_NAME#v}"
          python3 tools/generate_release_metadata.py \
            --version "${VERSION}" \
            --tag "${GITHUB_REF_NAME}" \
            --repository "${GITHUB_REPOSITORY}" \
            --variant esp32_2432s028_ili9341=dist/firmware-esp32_2432s028_ili9341.bin \
            --variant esp32_2432s028_st7789=dist/firmware-esp32_2432s028_st7789.bin \
            --variant esp32_32e_st7789=dist/firmware-esp32_32e_st7789.bin \
            --output dist/metadata.json

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/firmware-esp32_2432s028_ili9341.bin
            dist/firmware-esp32_2432s028_st7789.bin
            dist/firmware-esp32_32e_st7789.bin
            dist/firmware-esp32_2432s028_ili9341-merged.bin
            dist/firmware-esp32_2432s028_st7789-merged.bin
            dist/firmware-esp32_32e_st7789-merged.bin
            dist/metadata.json
          overwrite_files: true
